# Template for one site behind the shared edge proxy.
# Copy to <domain>.conf, replace example.com with the real domain and
# ${STACK} with the instance's STACK, then reload edge-nginx.
# Real per-domain files are gitignored: this repo is public.

# --- HTTP: Let's Encrypt validation + redirect to HTTPS ---
server {
    listen 80;
    server_name example.com;

    # Required for renewal, not just first issuance — keep it in every :80 block.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: SSL termination + reverse proxy ---
server {
    listen 443 ssl;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 10M;

    # Docker's embedded DNS, re-resolved every 30s. Without this nginx caches the
    # app's IP at startup and 502s after any redeploy that recreates the container.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $app http://${STACK}-app:3001;
        proxy_pass $app$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
