# Catch-all for hostnames with no server block of their own.
#
# Without this, nginx falls back to whichever site is alphabetically first and
# serves it under the wrong domain with the wrong certificate — one tenant's
# data appearing on another tenant's address. 444 closes the connection, so a
# misconfigured or not-yet-configured domain fails visibly instead.
#
# The filename starts with 000 so it loads first.
#
# Copy to 000-default.conf and point ssl_certificate at any lineage that
# actually exists on the host — which one is irrelevant, every request here
# is dropped, but nginx will not start without a readable certificate.

server {
    listen 80 default_server;
    server_name _;

    # Still answer ACME, so a new domain can be issued a certificate before it
    # has a server block.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 444; }
}

server {
    listen 443 ssl default_server;
    server_name _;

    # A certificate is required to terminate TLS at all; which one does not
    # matter, since every request here is dropped.
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    return 444;
}
