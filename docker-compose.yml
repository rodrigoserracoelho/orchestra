# One orchestra instance: database + app, no published ports.
# TLS and :80/:443 belong to the shared edge proxy (deploy/proxy), which reaches
# the app over the external "web" network. STACK names the containers so several
# instances can share the VM; it comes from .env on the server.

services:
  # --- MySQL database ---
  mysql:
    image: mysql:8.0
    container_name: ${STACK:-orchestra}-mysql
    restart: unless-stopped
    # Let InnoDB finish flushing before SIGKILL; the default 10s is tight.
    stop_grace_period: 60s
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-orchestra_root_pass}
      MYSQL_DATABASE: ${DB_NAME:-orchestra_attendance}
      MYSQL_USER: ${DB_USER:-orchestra}
      MYSQL_PASSWORD: ${DB_PASSWORD:-orchestra_pass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # --- Node.js app (API + built frontend) ---
  app:
    # Named so an image built elsewhere (deploy-new.sh --local-build) can be
    # loaded on the server and started with `up -d --no-build`.
    image: ${STACK:-orchestra}-app:deploy
    build:
      context: .
      args:
        BASE_PATH: /
        BRANDING: ${BRANDING:-example}
        ORG_NAME: ${ORG_NAME:-Orchestra}
        ORG_LEGAL_NAME: ${ORG_LEGAL_NAME:-}
        LOGO_WORDMARK: ${LOGO_WORDMARK:-false}
        LOGO_EXT: ${LOGO_EXT:-svg}
    container_name: ${STACK:-orchestra}-app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal
      - web

volumes:
  mysql_data:

networks:
  internal:
  web:
    external: true
